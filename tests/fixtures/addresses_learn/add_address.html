<!doctype html>
<html>
<head><meta charset="utf-8"><title>Your addresses</title></head>
<body>
<h1>No saved addresses yet</h1>
<button id="add" type="button">+ Add new address</button>
<button id="save" type="button">Save address</button>
<script>
  window.__writes = [];
  document.getElementById('add').onclick = () => window.__writes.push('add');
  document.getElementById('save').onclick = () => window.__writes.push('save');
</script>
</body>
</html>
