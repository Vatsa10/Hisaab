<!doctype html>
<html>
<head><meta charset="utf-8"><title>My account</title></head>
<body>
<header><a href="/account">Profile</a> <span>Test User</span></header>
<nav id="menu">
  <a href="/account/orders">Order history</a>
  <a href="/account/favourites">Favourites</a>
  <a href="/account/addresses" id="addr-link">{{LINK}}</a>
</nav>
<button id="add-top" type="button">Add new address</button>
<main id="main"><p>Welcome back</p></main>
<script>
  // Every address-changing control records itself here; the learner must never touch one.
  window.__writes = [];
  document.getElementById('add-top').onclick = () => window.__writes.push('add');
  fetch('/webroutes/user/orders').then(r => r.json());
  document.getElementById('addr-link').onclick = async (e) => {
    e.preventDefault();
    history.pushState({}, '', '/account/addresses');
    const data = await (await fetch('/webroutes/user/saved_locations?client=web')).json();
    const main = document.getElementById('main');
    main.innerHTML = '<h1>Saved addresses</h1>';
    for (const a of data.data.addresses) {
      const div = document.createElement('div');
      div.textContent = a.address_type + ': ' + a.full_address + ' ';
      for (const word of ['Edit', 'Delete', 'Deliver here', 'Set as default']) {
        const b = document.createElement('button');
        b.type = 'button';
        b.textContent = word;
        b.onclick = () => window.__writes.push(word);
        div.appendChild(b);
      }
      main.appendChild(div);
    }
  };
</script>
</body>
</html>
