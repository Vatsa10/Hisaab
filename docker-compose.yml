# Local stack: Postgres + migrations + API + worker. Dev-only credentials; see docs/deploy-local.md.
x-app-env: &app-env
  DATABASE_URL: ${COMPOSE_DATABASE_URL:-postgresql://postgres:postgres@db:5432/postgres}
  SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET:-local-dev-jwt-secret-change-me-0123456789}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-haiku-5-5}
  TYPESAFE_API_KEY: ${TYPESAFE_API_KEY:-}
  SMTP_HOST: ${SMTP_HOST:-mailpit}
  SMTP_PORT: "${SMTP_PORT:-1025}"
  APP_URL: ${APP_URL:-http://localhost:3000}
  VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
  VAPID_SUBJECT: ${VAPID_SUBJECT:-}
  VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
  MONTHLY_BUDGET_INR: "${MONTHLY_BUDGET_INR:-5000}"
  PROXY_INR_PER_GB: "${PROXY_INR_PER_GB:-400}"
  AI_INR_PER_1K_TOKENS: "${AI_INR_PER_1K_TOKENS:-0.05}"
  WORKER_INR_PER_MINUTE: "${WORKER_INR_PER_MINUTE:-0.20}"
  FIXED_MONTHLY_INR: "${FIXED_MONTHLY_INR:-0}"
  REFRESH_PER_APP_PER_DAY: "${REFRESH_PER_APP_PER_DAY:-3}"
  CART_CHECKS_PER_DAY: "${CART_CHECKS_PER_DAY:-10}"
  SYNC_INTERVAL_H: "${SYNC_INTERVAL_H:-24}"
  PAUSED_SYNC_INTERVAL_H: "${PAUSED_SYNC_INTERVAL_H:-72}"
  BUDGET_ALERT_PCT: "${BUDGET_ALERT_PCT:-80}"
  BUDGET_PAUSE_PCT: "${BUDGET_PAUSE_PCT:-100}"
  JEV_TOKENS_PER_CALL: "${JEV_TOKENS_PER_CALL:-1000}"
  APP_TZ: "${APP_TZ:-Asia/Kolkata}"
  APPROVAL_TIMEOUT_S: "${APPROVAL_TIMEOUT_S:-600}"
  MAX_LEARN_JOB_S: "${MAX_LEARN_JOB_S:-2400}"
  SYNC_BLOCK_MEDIA: "${SYNC_BLOCK_MEDIA:-1}"
  SCHEDULER_TICK_S: "${SCHEDULER_TICK_S:-900}"
  SMTP_USER: "${SMTP_USER:-}"
  SMTP_PASSWORD: "${SMTP_PASSWORD:-}"
  SMTP_STARTTLS: "${SMTP_STARTTLS:-0}"
  SMTP_FROM: "${SMTP_FROM:-Hisaab <no-reply@localhost>}"
  CORS_ORIGINS: "${CORS_ORIGINS:-http://localhost:3000}"
  SUPABASE_JWKS_URL: "${SUPABASE_JWKS_URL:-}"
  # Worker timing (DRAIN_S must stay inside the worker's termination grace period)
  HEARTBEAT_S: "${HEARTBEAT_S:-30}"
  MAX_JOB_S: "${MAX_JOB_S:-1200}"
  DRAIN_S: "${DRAIN_S:-540}"
  STALE_JOB_S: "${STALE_JOB_S:-300}"  # a running job with no heartbeat for this long is requeued (sync) or failed (connect)
  # Cart fills (Plan 6)
  CART_FILLS_PER_DAY: "${CART_FILLS_PER_DAY:-5}"
  CART_FILL_MAX_AGE_S: "${CART_FILL_MAX_AGE_S:-1800}"
  CART_LOCATION_MAX_M: "${CART_LOCATION_MAX_M:-500}"
  FILL_CONFIRM_WINDOW_S: "${FILL_CONFIRM_WINDOW_S:-600}"
  # Cheapest cart (Plan 5)
  SPLIT_MIN_SAVING_INR: "${SPLIT_MIN_SAVING_INR:-20}"
  CART_MAX_ITEMS: "${CART_MAX_ITEMS:-30}"
  FOOD_MAX_ITEMS: "${FOOD_MAX_ITEMS:-20}"
  CART_STALE_S: "${CART_STALE_S:-1500}"
  MATCH_JUDGE: "${MATCH_JUDGE:-1}"
  MATCH_MODEL: "${MATCH_MODEL:-}"  # empty: the LLM default model
  MENU_CACHE_TTL_S: "${MENU_CACHE_TTL_S:-1800}"
  FOOD_LOOKUPS_PER_DAY: "${FOOD_LOOKUPS_PER_DAY:-30}"
  # Hardening (Plan 7): job retries, per-site back-off, error budget, re-login reminders
  MAX_JOB_ATTEMPTS: "${MAX_JOB_ATTEMPTS:-3}"
  BACKOFF_BASE_S: "${BACKOFF_BASE_S:-60}"
  BACKOFF_MAX_S: "${BACKOFF_MAX_S:-3600}"
  BACKOFF_RESET_H: "${BACKOFF_RESET_H:-24}"
  ERROR_BUDGET_WINDOW_H: "${ERROR_BUDGET_WINDOW_H:-24}"
  ERROR_BUDGET_MIN_JOBS: "${ERROR_BUDGET_MIN_JOBS:-10}"
  ERROR_BUDGET_MAX_FAILURE_PCT: "${ERROR_BUDGET_MAX_FAILURE_PCT:-30}"
  NEEDS_LOGIN_REMIND_H: "${NEEDS_LOGIN_REMIND_H:-72}"

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:54330:5432"  # loopback only: dev credentials
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    image: postgres:16
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: postgres
    volumes:
      - ./tests/server/bootstrap.sql:/migrations/bootstrap.sql:ro
      - ./supabase/migrations:/migrations/supabase:ro
    entrypoint: ["bash", "-c"]
    command:
      - |
        set -e
        P="psql -v ON_ERROR_STOP=1 -q -h db -U postgres -d postgres"
        $$P -c "create table if not exists public._local_migrations (name text primary key, applied_at timestamptz not null default now())"
        # Each file runs in its own transaction together with its tracking row; recorded files are skipped.
        apply() {
          name=$$(basename "$$1")
          if [ "$$($$P -tA -c "select 1 from public._local_migrations where name = '$$name'")" = 1 ]; then
            echo "skipping $$name (already applied)"
          else
            echo "applying $$name"
            $$P --single-transaction -f "$$1" -c "insert into public._local_migrations (name) values ('$$name')"
          fi
        }
        apply /migrations/bootstrap.sql
        for f in $$(ls /migrations/supabase/*.sql | sort); do apply "$$f"; done
        # Local-only login for the Ask analyst (migration 0006 creates the role NOLOGIN); same dev credentials as the rest.
        $$P -c "alter role ask_reader login password 'ask_reader_local'"
        echo "migrations done"
    restart: "no"

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      <<: *app-env
      ASK_DATABASE_URL: ${COMPOSE_ASK_DATABASE_URL:-postgresql://ask_reader:ask_reader_local@db:5432/postgres}
    ports:
      - "127.0.0.1:8000:8000"

  worker:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      <<: *app-env
      PROFILE_STORE_URL: file:///data/vault
      PROFILE_MASTER_KEY: ${PROFILE_MASTER_KEY:-}
      ALLOW_DEV_PROFILE_KEY: "1"  # local file:// vault only: fixed dev key when PROFILE_MASTER_KEY is empty
      PROXY_URL_TEMPLATE: ${PROXY_URL_TEMPLATE:-}
      TZ: Asia/Kolkata
    shm_size: 1gb
    volumes:
      - vault:/data/vault

  scheduler:  # queues due daily syncs, sends budget alerts, dispatches notifications (every SCHEDULER_TICK_S)
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      <<: *app-env
    command: ["python", "-m", "server.scheduler"]

  mailpit:  # local SMTP sink: the UI at http://localhost:8025 shows every email the app sends
    image: axllent/mailpit:v1.21
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

volumes:
  pgdata:
  vault:
