# Local stack: Postgres + migrations + API + worker. Dev-only credentials; see docs/deploy-local.md.
x-app-env: &app-env
  DATABASE_URL: ${COMPOSE_DATABASE_URL:-postgresql://postgres:postgres@db:5432/postgres}
  SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET:-local-dev-jwt-secret-change-me-0123456789}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  TYPESAFE_API_KEY: ${TYPESAFE_API_KEY:-}

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:54330:5432"  # loopback only: dev credentials
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    image: postgres:16
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: postgres
    volumes:
      - ./tests/server/bootstrap.sql:/migrations/bootstrap.sql:ro
      - ./supabase/migrations:/migrations/supabase:ro
    entrypoint: ["bash", "-c"]
    command:
      - |
        set -e
        P="psql -v ON_ERROR_STOP=1 -q -h db -U postgres -d postgres"
        $$P -c "create table if not exists public._local_migrations (name text primary key, applied_at timestamptz not null default now())"
        # Each file runs in its own transaction together with its tracking row; recorded files are skipped.
        apply() {
          name=$$(basename "$$1")
          if [ "$$($$P -tA -c "select 1 from public._local_migrations where name = '$$name'")" = 1 ]; then
            echo "skipping $$name (already applied)"
          else
            echo "applying $$name"
            $$P --single-transaction -f "$$1" -c "insert into public._local_migrations (name) values ('$$name')"
          fi
        }
        apply /migrations/bootstrap.sql
        for f in $$(ls /migrations/supabase/*.sql | sort); do apply "$$f"; done
        echo "migrations done"
    restart: "no"

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      <<: *app-env
    ports:
      - "127.0.0.1:8000:8000"

  worker:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      <<: *app-env
      PROFILE_STORE_URL: file:///data/vault
      PROFILE_MASTER_KEY: ${PROFILE_MASTER_KEY:-}
      ALLOW_DEV_PROFILE_KEY: "1"  # local file:// vault only: fixed dev key when PROFILE_MASTER_KEY is empty
      PROXY_URL_TEMPLATE: ${PROXY_URL_TEMPLATE:-}
    shm_size: 1gb
    volumes:
      - vault:/data/vault

volumes:
  pgdata:
  vault:
